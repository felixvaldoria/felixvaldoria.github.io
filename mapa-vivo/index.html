<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGE OF KINGS — Tarjeta de prueba · Mapa vivo</title>
<style>
:root{
  --ink:#050a14; --bg:#08111f; --bg2:#0b1729; --panel:#10233c; --panel2:#0b1a2e; --panel3:#152d4b;
  --gold:#d8ab4e; --gold2:#f2cf7a; --gold-dark:#7a5b22; --stone:#2a3b52; --parchment:#eadfc2;
  --txt:#f5edd8; --mut:#aeb9c6; --mut2:#7f8da0; --green:#67bd72; --green-dark:#173b24;
  --red:#e0644f; --red-dark:#4a1e18; --blue:#67a7dc; --teal:#55c2b8; --amber:#e9b44c;
  --shadow:0 6px 16px rgba(0,0,0,.26); --radius:14px;
  --wood1:#6b4423; --wood2:#4a2c12; --woodline:#3a2110;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;background:
    radial-gradient(900px 420px at 15% -8%,rgba(216,171,78,.14),transparent 60%),
    linear-gradient(180deg,#12240f,#0a1408 60%,#060d05);
  color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;overflow-x:hidden}
button{font:inherit;cursor:pointer}
.phone{width:min(400px,100%);margin:0 auto;position:relative}
/* ---------- Barra de prueba (NO es del juego) ---------- */
.testbar{background:rgba(4,8,16,.97);border-bottom:2px solid var(--gold);padding:6px 10px 7px;text-align:center}
.testbar .tt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);font-weight:800}
.testbar .ts{font-size:11px;color:var(--mut);margin-top:1px}
/* ---------- Escena a pantalla completa ---------- */
.scene{position:relative;width:100%;aspect-ratio:1/2;overflow:hidden;background:#20380f;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.scene .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
/* ---------- Placa de madera del mapa ---------- */
.mapplaque{position:absolute;top:7px;left:7px;right:7px;z-index:8;display:flex;align-items:center;gap:8px;
  padding:7px 9px;border-radius:10px;border:2px solid #2c1a08;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 9px),
    linear-gradient(180deg,rgba(107,68,35,.94),rgba(66,40,16,.95));
  box-shadow:inset 0 0 0 1px rgba(242,207,122,.35),inset 0 1px 0 rgba(255,235,190,.25),0 5px 14px rgba(0,0,0,.5)}
.mapplaque .mtitle{font-family:Georgia,"Times New Roman",serif;font-size:16.5px;font-weight:700;color:#ffe9ad;text-shadow:0 1px 2px rgba(0,0,0,.75);white-space:nowrap;overflow:hidden}
.capchip{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;background:rgba(5,10,20,.82);border:1px solid rgba(242,207,122,.55);color:#ffe9ad;font-size:11.5px;font-weight:800;border-radius:99px;padding:5px 9px;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.capchip:active{transform:scale(.96)}
/* ---------- Letreros de navegación (abajo, dentro de la escena) ---------- */
.signs{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-between;align-items:flex-end;padding:0 3px 5px;pointer-events:none}
.sign{pointer-events:auto;background:none;border:0;display:flex;flex-direction:column;align-items:center;min-width:0;flex:1}
.sign .post{width:5px;height:9px;background:linear-gradient(90deg,#3a2110,#6b4423,#3a2110);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.sign .board{background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 7px),
    linear-gradient(180deg,rgba(107,68,35,.96),rgba(66,40,16,.97));
  border:2px solid #2c1a08;border-radius:7px;color:#f2cf7a;font-size:9.5px;font-weight:800;line-height:1.25;
  padding:4px 2px 5px;width:96%;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.75);
  box-shadow:inset 0 0 0 1px rgba(242,207,122,.28),0 4px 9px rgba(0,0,0,.5)}
.sign .board .sic{display:block;font-size:15px;line-height:1.1}
.sign.on .board{border-color:var(--gold2);color:#ffe9ad;box-shadow:inset 0 0 0 1px rgba(242,207,122,.55),0 0 12px rgba(216,171,78,.55),0 4px 9px rgba(0,0,0,.5)}
/* ---------- Zonas tocables ---------- */
.zone{position:absolute;background:rgba(216,171,78,0);border:2px solid transparent;border-radius:16px;z-index:5;padding:0;transition:background .2s,border-color .2s,box-shadow .2s}
.zone .zlabel{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;background:rgba(5,10,20,.84);color:#f5edd8;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:99px;white-space:nowrap;pointer-events:none;border:1px solid rgba(216,171,78,.25)}
.zone .zlabel.top{bottom:auto;top:3px}
.zone .zlabel b{color:var(--gold2)}
.zone.sel{border-color:var(--gold2);background:rgba(216,171,78,.13);box-shadow:0 0 0 2px rgba(216,171,78,.35),inset 0 0 26px rgba(216,171,78,.20)}
.zone.pulse{animation:pulsering .8s ease-in-out 2}
@keyframes pulsering{0%,100%{box-shadow:0 0 0 0 rgba(242,207,122,0)}50%{border-color:var(--gold2);box-shadow:0 0 0 6px rgba(242,207,122,.45),inset 0 0 30px rgba(216,171,78,.35)}}
/* ---------- Rutas y marcador de marcha ---------- */
#paths{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#paths path{fill:none;stroke:#f2cf7a;stroke-width:2.6;vector-effect:non-scaling-stroke;stroke-dasharray:6 5;stroke-linecap:round;opacity:0;transition:opacity .35s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.65))}
#paths path.on{opacity:.92}
#paths circle{fill:#f2cf7a;opacity:0;transition:opacity .35s}
#paths circle.on{opacity:.95}
.marker{position:absolute;z-index:9;width:38px;height:38px;margin:-36px 0 0 -19px;display:none;pointer-events:none;
  border-radius:50%;border:2.5px solid var(--gold2);
  background:radial-gradient(circle at 35% 30%,#7db8e8,#2456a8 70%);
  box-shadow:0 5px 14px rgba(0,0,0,.6),0 0 12px rgba(216,171,78,.5);
  font-size:19px;line-height:34px;text-align:center}
.marker:after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:5px solid transparent;border-top:7px solid var(--gold2);border-bottom:0}
.marker.on{display:block}
.marchchip{position:absolute;z-index:11;transform:translate(-50%,-100%);display:none;align-items:center;gap:7px;
  background:rgba(5,10,20,.92);border:1px solid var(--amber);color:#ffe1a1;font-size:11.5px;font-weight:800;
  border-radius:99px;padding:5px 6px 5px 10px;box-shadow:0 5px 14px rgba(0,0,0,.55);white-space:nowrap}
.marchchip.on{display:flex}
.marchchip.below{transform:translate(-50%,18px)}
.marchchip .cx{background:#3a2a10;border:1px solid #80652e;color:#ffe9ad;border-radius:99px;font-size:11px;font-weight:900;padding:3px 8px}
.marchchip .cx:active{transform:scale(.95)}
/* ---------- Destellos de celebración ---------- */
.spark{position:absolute;z-index:10;pointer-events:none;overflow:visible;width:10px;height:10px}
.spark span{position:absolute;font-size:19px;opacity:0;animation:sparkfly 1.7s ease-out forwards}
@keyframes sparkfly{0%{opacity:0;transform:translateY(8px) scale(.6)}18%{opacity:1}100%{opacity:0;transform:translateY(-84px) scale(1.15)}}
/* ---------- Aviso flotante ---------- */
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(16px);z-index:30;max-width:88%;
  background:rgba(5,10,20,.94);border:1px solid var(--gold);color:#ffe9b0;font-size:12.5px;font-weight:700;text-align:center;
  border-radius:12px;padding:9px 13px;box-shadow:0 8px 22px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- Hoja dorada (fichas y paneles) ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:68%;overflow-y:auto;
  transform:translateY(106%);transition:transform .38s cubic-bezier(.32,.9,.35,1);
  background:linear-gradient(168deg,rgba(23,45,71,.985),rgba(9,21,37,.99));
  border-top:2px solid rgba(216,171,78,.65);border-radius:18px 18px 0 0;
  box-shadow:0 -12px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);padding:13px 13px 16px}
.sheet.open{transform:none}
.sheet h3{font-family:Georgia,"Times New Roman",serif;font-size:17.5px;color:#f4d98d;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.itemhead{display:flex;gap:9px;align-items:flex-start;min-width:0}
.itemicon{width:44px;height:44px;flex:0 0 auto;border-radius:12px;border:1px solid rgba(216,171,78,.32);background:linear-gradient(145deg,#213a59,#0c1c30);display:grid;place-items:center;font-size:23px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 7px;font-size:11px;font-weight:800;background:#263850;color:#dce7f2;border:1px solid #435d79;white-space:nowrap}
.pill.gold{background:#2b2110;color:var(--gold2);border-color:#80652e}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;border-radius:10px;border:1px solid #9a7a34;padding:8px 12px;background:linear-gradient(180deg,#f0cd76,#c99b38);color:#211604;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.24),inset 0 1px 0 #fff9}
.btn.ghost{background:transparent;color:var(--gold2);border-color:#66552c;box-shadow:none}
.btn.sm{min-height:35px;padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.btnrow .btn{flex:1 1 30%}
.desc{font-size:13px;color:#e8e0c8;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.bar{display:block;height:9px;background:#060d1a;border:1px solid rgba(233,180,76,.5);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c99b38,var(--gold2));width:0%}
.bar.hp{height:13px}
.bar.hp i{background:linear-gradient(90deg,#8e2f24,var(--red) 60%,#f0866f)}
.honest{margin-top:9px;font-size:11.5px;color:var(--mut);background:rgba(216,171,78,.07);border:1px dashed rgba(216,171,78,.4);border-radius:10px;padding:7px 9px}
.note{margin-top:8px;font-size:12px;color:var(--amber)}
.closex{margin-left:auto;background:#0a1626;border:1px solid #435d79;color:#dce7f2;border-radius:99px;width:30px;height:30px;font-size:14px;flex:0 0 auto}
.mut{color:var(--mut)} .sm{font-size:12px} .b{font-weight:800}
.rowline{display:flex;align-items:center;gap:8px;background:#0a1626;border:1px solid #30465f;border-radius:12px;padding:8px 10px;margin-top:7px}
.rowline .ric{font-size:20px}
.rowline .rmain{flex:1;min-width:0}
.rowline .rt{font-weight:800;font-size:13.5px}
.rowline .rs{font-size:11.5px;color:var(--mut)}
.rowline .rnum{font-family:Georgia,serif;font-size:17px;color:var(--gold2);font-weight:700}
.kvrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:9px}
.kvrow .k{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.kvrow .v{font-family:Georgia,serif;font-size:16px;color:var(--gold2);font-weight:700}
</style>
</head>

<script>

const fmt = n => n.toLocaleString("es-ES");
const HONEST = `<p class="honest">Muestra sin conexión: los datos son de ejemplo y ninguna marcha sale de verdad.</p>`;

/* ================= Fichas de los lugares ================= */
function headHTML(icon, titulo, pillTxt){
  return `<div class="itemhead"><div class="itemicon">${icon}</div>
    <div style="flex:1;min-width:0"><h3>${titulo}</h3>
    <div class="chips" style="margin-top:5px">${pillTxt}</div></div><button class="closex" aria-label="Cerrar">✕</button></div>`;
}
function rowsHTML(rows){
  return rows.map(r => `<div class="rowline"><span class="ric">${r[0]}</span>
    <div class="rmain"><div class="rt">${r[1]}</div>${r[2] ? `<div class="rs">${r[2]}</div>` : ""}</div>
    ${r[3] ? `<span class="rnum">${r[3]}</span>` : ""}</div>`).join("");
}

  rival2: () => headHTML("⚔️","Castillo de Pplls", `<span class="pill gold">📍 (38, 41)</span><span class="pill">👤 El reino manco · Pplls</span><span class="pill">🚶 A 21 casillas</span>`)

    + `<div class="btnrow">

        <button class="btn" data-toast="Muestra: el camino a Pplls no está dibujado en esta tarjeta; la marcha larga se vería igual que las demás.">🏳 Conquistar</button>
        <button class="btn ghost" data-toast="Muestra: tus espías saldrían hacia el castillo de Pplls.">🕵 Espiar</button>
      </div>` + HONEST,
  npc: () => headHTML("🏛️","Ciudad libre de Brunnar", `<span class="pill gold">📍 (83, 55)</span><span class="pill">🏳 Ciudad neutral · sin dueño</span><span class="pill">🚶 A 15 casillas</span>`)

    + rowsHTML([
        ["🛡️","Guarnición","200 infantería · 140 arqueros · 80 caballería","420"],

        ["⏱","Tiempo de marcha","Cruzando el puente bajo","45 min"]

    + `<div class="btnrow">

        <button class="btn ghost" data-toast="Muestra: tus espías rodearían la muralla de Brunnar.">🕵 Espiar</button>
      </div>` + HONEST,
  ruinas: () => headHTML("🏺","Ruinas antiguas", `<span class="pill gold">📍 (41, 37)</span><span class="pill">🏺 Evento del mapa · 48 h</span><span class="pill">🚶 A 19 casillas</span>`)
    + `<p class="desc">Columnas rotas de un reino que ya nadie recuerda. Dicen que bajo las losas duerme un tesoro… y sus guardianes.</p>`
    + rowsHTML([
        ["🛡️","Guardianes de piedra","Defensores de las ruinas","~180"],
        ["💰","Botín estimado","Oro y hierro del tesoro","🪙 900 · ⛏️ 450"],
        ["⏱","Tiempo de marcha","Por el camino del oeste","55 min"]
      ])
    + `<div class="btnrow"><button class="btn block" data-march="ruinas">🏺 Saquear ruinas</button></div>` + HONEST,
  campamento: () => headHTML("⛺","Campamento bárbaro", `<span class="pill gold">📍 (35, 52)</span><span class="pill">🔥 Evento del mapa · 36 h</span><span class="pill">🚶 A 14 casillas</span>`)
    + `<p class="desc">Tiendas y hogueras al borde del bosque. Los bárbaros roban a los viajeros y amontonan el botín en el centro del campamento.</p>`
    + rowsHTML([
        ["🛡️","Bárbaros","Defensores estimados","~120"],
        ["💰","Botín estimado","Mixto, de los viajeros","🪵 600 · 🪨 350 · 🪙 220"],
        ["⏱","Tiempo de marcha","Por el camino del oeste","40 min"]
      ])
    + `<div class="btnrow"><button class="btn block" data-march="campamento">⛺ Atacar campamento</button></div>` + HONEST,
  coloso: () => headHTML("🐉","EL COLOSO", `<span class="pill gold">📍 (60, 60) · Centro del mapa</span><span class="pill">⏳ Termina el jueves 08:24</span>`)
    + `<p class="desc">Un dragón de piedra duerme sobre la tierra negra. Todo el reino le pega a la vez: el daño no se cura y los premios son para los que más le hagan.</p>`
    + `<div class="kvrow"><span class="k">Vida del Coloso</span><span class="v">84 %</span></div>
       <span class="bar hp"><i style="width:84%"></i></span>`
    + rowsHTML([
        ["💥","Daño del reino","Entre todos los imperios","70.344"],
        ["🏅","Tu puesto","3º · tu daño: 12.480","3º"],
        ["🎁","Premio si cae","1º: 🪙 5.000 + paquete grande + ⏩","🐉"]
      ])
    + `<div class="btnrow"><button class="btn block" data-march="coloso">🐉 Atacar al Coloso</button></div>` + HONEST,
  columna: () => headHTML("🚩","Tu ejército en marcha", `<span class="pill gold">🚶 Capital → Ruinas antiguas</span><span class="pill">⏱ Llega en 0:07 (muestra)</span>`)
    + `<p class="desc">Tu columna cruza el puente con los estandartes azules al frente. La que se ve pintada en el camino es esta misma marcha.</p>`
    + rowsHTML([
        ["⚔️","Tropas en la columna","120 infantería · 80 arqueros · 40 caballería","240"],
        ["🎯","Objetivo","Saqueo de las ruinas","🏺"]
      ])
    + `<div class="btnrow"><button class="btn ghost block" data-toast="Muestra: la marcha se cancelaría y el ejército daría la vuelta hacia tu capital.">↩️ Cancelar marcha</button></div>` + HONEST
};

/* ================= Hoja y avisos ================= */
function openSheet(html){
  const s = $("sheet");
  s.innerHTML = html;
  s.classList.add("open");
  s.scrollTop = 0;
  const x = s.querySelector(".closex");
  if (x) x.addEventListener("click", closeSheet);
  s.querySelectorAll("[data-toast]").forEach(b => b.addEventListener("click", () => toast(b.dataset.toast)));
  s.querySelectorAll("[data-march]").forEach(b => b.addEventListener("click", () => startMarch(b.dataset.march)));
  s.querySelectorAll("[data-note]").forEach(b => b.addEventListener("click", () => openNote(b.dataset.note)));
}
function closeSheet(){
  $("sheet").classList.remove("open");
  document.querySelectorAll(".zone").forEach(x => x.classList.remove("sel"));
}
let toastInt = null;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastInt);
  toastInt = setTimeout(() => t.classList.remove("on"), 3400);
}
const NOTAS = {
  ciudad: ["🏰","Ciudad","En la muestra, este letrero te devolvería a la Ciudad viva: tu aldea entera dentro de la pintura, como en la otra tarjeta."],
  ejercito: ["⚔️","Ejército","En la muestra, este letrero te llevaría a la pantalla de Ejército: tus tropas, comandantes y marchas en curso."],
  mercado: ["🧺","Mercado","En la muestra, este letrero te llevaría al Mercado: ofertas de la región, contratos y caravanas."],
  chat: ["💬","Chat","En la muestra, este letrero te llevaría al Chat del reino, con el Sabio de Valdoria en su lateral."],
  perfil: ["👤","Perfil","En la muestra, este letrero te llevaría a tu Perfil: tu imperio, tus avisos al teléfono y tus aceleradores."],
  mapa: ["🗺️","Mapa","Ya estás en el Mapa: es la pantalla que estás tocando."]
};
function openNote(cual){
  const n = NOTAS[cual];
  openSheet(headHTML(n[0], n[1], `<span class="pill gold">🧭 Letrero de navegación</span>`)
    + `<p class="desc">${n[2]}</p>` + HONEST);
}

/* ================= Zonas ================= */
function buildZones(){
  const wrap = $("zones");
  ZONAS.forEach(z => {
    const b = document.createElement("button");
    b.className = "zone"; b.dataset.z = z.id;
    b.style.left = z.l + "%"; b.style.top = z.t + "%";
    b.style.width = z.w + "%"; b.style.height = z.h + "%";
    b.setAttribute("aria-label", z.label.replace(/<[^>]+>/g, ""));
    b.innerHTML = `<span class="zlabel${z.labTop ? " top" : ""}">${z.label}</span>`;
    b.addEventListener("click", () => {
      document.querySelectorAll(".zone").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      openSheet(FICHAS[z.id]());
    });
    wrap.appendChild(b);
  });
}

/* ================= La marcha ================= */
/* Puntos de los caminos pintados (coordenadas SVG 100×200). La capital es el origen común. */
const RUTA_IZQ = [[50,166],[40,168],[33,160],[28,148],[23,134],[19,118],[16,104]];
const MARCHAS = {
  coloso:     {nom:"el Coloso",          corto:"el Coloso",  pts: RUTA_IZQ.concat([[14,98],[22,99],[32,98],[42,99]]), fin:[45,99]},
  campamento: {nom:"el campamento bárbaro", corto:"los Bárbaros", pts: RUTA_IZQ.concat([[13,94],[10,87]]), fin:[10,87]},
  ruinas:     {nom:"las Ruinas antiguas", corto:"las Ruinas", pts: RUTA_IZQ.concat([[14,92],[13,80],[14,72],[17,67],[20,65]]), fin:[20,65]},
  npc:        {nom:"Brunnar",            corto:"Brunnar",    pts: [[50,166],[60,165],[67,163],[71,161],[76,152],[81,140],[81,126],[80,116],[81,104],[84,94],[86,87]], fin:[86,87]},
  rival1:     {nom:"el castillo de ÆZAZEL", corto:"ÆZAZEL",  pts: [[50,166],[60,165],[67,163],[71,161],[76,152],[81,140],[81,126],[80,116],[81,104],[84,94],[82,80],[79,68],[74,59]], fin:[74,59]}
};
const DUR_MARCHA = 14000;
let march = null;   // {key, path, len, prog, dir, last, estado}
let rafActivo = false;
function smoothD(pts){
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0]} ${p2[1]}`;
  }
  return d;
}
function buildPaths(){
  const svg = $("paths"), NS = "http://www.w3.org/2000/svg";
  for (const key in MARCHAS){
    const p = document.createElementNS(NS, "path");
    p.id = "path-" + key;
    p.setAttribute("d", smoothD(MARCHAS[key].pts));
    svg.appendChild(p);
    const c = document.createElementNS(NS, "circle");
    c.id = "dot-" + key;
    c.setAttribute("cx", MARCHAS[key].fin[0]); c.setAttribute("cy", MARCHAS[key].fin[1]); c.setAttribute("r", 1.6);
    svg.appendChild(c);
  }
}
function fmtReloj(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function colocarMarcador(pt){
  const m = $("marker"), chip = $("marchChip"), W = $("scene").clientWidth;
  m.style.left = pt.x + "%"; m.style.top = (pt.y / 2) + "%";
  const mitad = chip.offsetWidth / 2;
  const cxPx = Math.min(W - mitad - 5, Math.max(mitad + 5, pt.x / 100 * W));
  chip.style.left = cxPx + "px";
  chip.style.top = (pt.y / 2) + "%";
  chip.classList.toggle("below", pt.y / 2 < 13);
  chip.style.marginTop = pt.y / 2 < 13 ? "0px" : "-46px";
}
function startMarch(key){
  const def = MARCHAS[key];
  document.querySelectorAll("#paths path, #paths circle").forEach(el => el.classList.remove("on"));
  const path = $("path-" + key);
  path.classList.add("on");
  $("dot-" + key).classList.add("on");
  march = {key, path, len: path.getTotalLength(), prog: 0, dir: 1, last: null, estado: "ida"};
  $("marker").classList.add("on");
  const chip = $("marchChip");
  chip.classList.add("on");
  $("marchBtn").textContent = "↩ Cancelar";
  $("marchBtn").disabled = false;
  $("marchTxt").textContent = `⚔ Hacia ${def.corto} · ${fmtReloj(DUR_MARCHA)}`;
  colocarMarcador(path.getPointAtLength(0));
  closeSheet();
  toast(`⚔ Tu ejército sale de la capital hacia ${def.nom} (muestra).`);
  if (!rafActivo){ rafActivo = true; requestAnimationFrame(tickMarcha); }
}
function tickMarcha(now){
  if (!march) return;
  if (march.last == null) march.last = now;
  const dt = Math.min(80, now - march.last);
  march.last = now;
  march.prog += march.dir * dt / DUR_MARCHA;
  const def = MARCHAS[march.key];
  if (march.dir > 0 && march.prog >= 1){
    march.prog = 1;
    march.estado = "posicion";
    rafActivo = false;
    colocarMarcador(march.path.getPointAtLength(march.len));
    $("marchTxt").textContent = `✅ En posición en ${def.nom}`;
    $("marchBtn").textContent = "✕ Cerrar";
    destellos(MARCHAS[march.key].fin);
    toast(`⚔ ¡Tu ejército ya está en ${def.nom}! (muestra)`);
    return;
  }
  if (march.dir < 0 && march.prog <= 0){
    march = null;
    rafActivo = false;
    $("marker").classList.remove("on");
    $("marchChip").classList.remove("on");
    document.querySelectorAll("#paths path, #paths circle").forEach(el => el.classList.remove("on"));
    toast("↩ Tu ejército ha regresado a la capital (muestra).");
    return;
  }
  const pt = march.path.getPointAtLength(march.prog * march.len);
  colocarMarcador(pt);
  if (march.dir > 0) $("marchTxt").textContent = `⚔ Hacia ${def.corto} · ${fmtReloj((1 - march.prog) * DUR_MARCHA)}`;
  else $("marchTxt").textContent = `↩ Regresando a la capital · ${fmtReloj(march.prog * DUR_MARCHA)}`;
  requestAnimationFrame(tickMarcha);
}
$("marchBtn").addEventListener("click", () => {
  if (!march) return;
  if (march.estado === "posicion"){
    march = null;
    $("marker").classList.remove("on");
    $("marchChip").classList.remove("on");
    document.querySelectorAll("#paths path, #paths circle").forEach(el => el.classList.remove("on"));
    return;
  }
  if (march.dir > 0){
    march.dir = -1;
    march.estado = "vuelta";
    $("marchBtn").textContent = "↩ Volviendo…";
    $("marchBtn").disabled = true;
  }
});
function destellos(fin){
  const fx = $("fx");
  const c = document.createElement("div");
  c.className = "spark";
  c.style.left = `calc(${fin[0]}% - 5px)`;
  c.style.top = `calc(${fin[1] / 2}% - 5px)`;
  const glifos = ["✨","⭐","💫","✨","🌟"];
  glifos.forEach((g, i) => {
    const s = document.createElement("span");
    s.textContent = g;
    s.style.left = (i * 15 - 28) + "px";
    s.style.animationDelay = (i * 0.13) + "s";
    c.appendChild(s);
  });
  fx.appendChild(c);
  setTimeout(() => c.remove(), 2600);
}

/* ================= Arranque ================= */
buildZones();
buildPaths();
$("capChip").addEventListener("click", () => {
  const z = document.querySelector('[data-z="capital"]');
  z.classList.remove("pulse");
  void z.offsetWidth;
  z.classList.add("pulse");
  setTimeout(() => z.classList.remove("pulse"), 1800);
});
document.querySelectorAll(".sign").forEach(s => s.addEventListener("click", () => {
  if (s.dataset.nav === "mapa"){ closeSheet(); return; }
  openNote(s.dataset.nav);
}));
</script>
